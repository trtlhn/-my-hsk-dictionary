<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HSK Words Visualized</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

header {
  padding: 12px;
  background: white;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

button, .file-button {
  border: 1px solid #ccc;
  border-radius: 7px;
  padding: 9px 13px;
  background: white;
  font-size: 14px;
  cursor: pointer;
}

.file-button {
  background: #dcecff;
  cursor: pointer;
}

input[type="file"] {
  display: none;
}

#status {
  font-size: 13px;
  color: #666;
}

#viewer {
  width: 100%;
  height: calc(100dvh - 65px);
  overflow: auto;
  background: #eee;
  -webkit-overflow-scrolling: touch;
}

#page {
  position: relative;
  margin: 15px auto;
  background: white;
  box-shadow: 0 2px 12px #0002;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#overlay {
  position: absolute;
  inset: 0;
}

.word {
  position: absolute;
  background: transparent;

  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;

  touch-action: pan-x pan-y;
}

#meaning {
  position: fixed;
  display: none;
  z-index: 1000;

  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;

  padding: 12px 15px;
  box-shadow: 0 4px 20px #0004;

  text-align: center;

  min-width: 135px;
  max-width: min(260px, 85vw);

  pointer-events: none;
  line-height: 1.6;

  overflow-wrap: break-word;
}

#meaning strong {
  font-size: 22px;
}

#meaning .pinyin {
  color: #2874b8;
  font-size: 16px;
}

#meaning .vietnamese {
  font-size: 14px;
  color: #333;
}

#placeholder {
  padding: 50px 20px;
  text-align: center;
  color: #666;
}
</style>

</head>

<body>

<header>

  <label class="file-button">
    Chọn bảng PDF
    <input
      type="file"
      id="pdfFile"
      accept=".pdf,application/pdf"
    >
  </label>

  <button id="zoomOut">−</button>
  <button id="zoomIn">+</button>

  <span id="status">Đang khởi động...</span>

</header>

<div id="viewer">

  <div id="placeholder">
    Chọn file PDF HSK Words Visualized để bắt đầu.
  </div>

  <div id="page" style="display:none">
    <canvas id="canvas"></canvas>
    <div id="overlay"></div>
  </div>

</div>

<div id="meaning"></div>


<!-- THƯ VIỆN ĐỌC PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- DỮ LIỆU TỪ VỰNG HSK 5 -->
<script src="./hsk5.js"></script>


<script>

/* =========================================
   1. CẤU HÌNH PDF
========================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================
   2. TỪ ĐIỂN CŨ
   Chỉ dùng khi từ chưa có trong hsk5.js
========================================= */

const dictionary = {

  "学习": ["xuéxí", "(Động từ) Học tập"],
  "经验": ["jīngyàn", "(Danh từ) Kinh nghiệm"],
  "获得": ["huòdé", "(Động từ) Đạt được, giành được"],
  "坚持": ["jiānchí", "(Động từ) Kiên trì"],

  "努力": ["nǔlì", "(Động từ/Tính từ) Nỗ lực, cố gắng"],
  "成功": ["chénggōng", "(Động từ/Danh từ) Thành công"],
  "失败": ["shībài", "(Động từ/Danh từ) Thất bại"],

  "希望": ["xīwàng", "(Động từ/Danh từ) Hy vọng"],
  "机会": ["jīhuì", "(Danh từ) Cơ hội"],
  "重要": ["zhòngyào", "(Tính từ) Quan trọng"],

  "决定": ["juédìng", "(Động từ/Danh từ) Quyết định"],
  "工作": ["gōngzuò", "(Động từ/Danh từ) Làm việc, công việc"],
  "生活": ["shēnghuó", "(Động từ/Danh từ) Sinh sống, cuộc sống"],

  "理解": ["lǐjiě", "(Động từ) Hiểu, thấu hiểu"],
  "影响": ["yǐngxiǎng", "(Động từ/Danh từ) Ảnh hưởng"],
  "选择": ["xuǎnzé", "(Động từ/Danh từ) Lựa chọn"],

  "提高": ["tígāo", "(Động từ) Nâng cao"],
  "改变": ["gǎibiàn", "(Động từ/Danh từ) Thay đổi"],
  "准备": ["zhǔnbèi", "(Động từ/Danh từ) Chuẩn bị"],

  "认真": ["rènzhēn", "(Tính từ) Nghiêm túc"],
  "责任": ["zérèn", "(Danh từ) Trách nhiệm"],
  "适应": ["shìyìng", "(Động từ) Thích nghi"],

  "发展": ["fāzhǎn", "(Động từ/Danh từ) Phát triển"],
  "完成": ["wánchéng", "(Động từ) Hoàn thành"],
  "解决": ["jiějué", "(Động từ) Giải quyết"]

};


/* =========================================
   3. LẤY DỮ LIỆU TỪ VỰNG

   ƯU TIÊN HSK 5 TRƯỚC
========================================= */

/* =========================================
   SỬA LỖI PDF ĐỌC LẶP CHỮ HÁN
   ÁP DỤNG CHO TOÀN BỘ BẢNG PDF
========================================= */

function findWordData(word) {

  const hsk5 = window.HSK5_DATA || {};

  if (
    Object.prototype.hasOwnProperty.call(hsk5, word)
  ) {
    return hsk5[word];
  }

  if (
    Object.prototype.hasOwnProperty.call(dictionary, word)
  ) {
    return dictionary[word];
  }

  return null;
}


/*
  Ví dụ PDF đọc sai:

  卡车车     → 卡车
  主人人     → 主人
  工工厂厂   → 工厂
  工工人人   → 工人
  平方方     → 平方
  打工工     → 打工

  Không tự ý xóa chữ lặp hợp lệ.
  Chỉ chọn từ sửa được nếu có trong từ điển.
*/

function resolveWord(rawWord) {

  const original = normalizeWord(rawWord);

  // Ưu tiên từ gốc nếu đã có nghĩa
  let data = findWordData(original);

  if (data) {
    return {
      word: original,
      data: data
    };
  }

  // Chia từ thành các nhóm ký tự giống nhau liên tiếp
  const groups = [];

  for (const char of Array.from(original)) {

    const last = groups[groups.length - 1];

    if (last && last.char === char) {
      last.count++;
    } else {
      groups.push({
        char: char,
        count: 1
      });
    }

  }

  // Không có chữ lặp thì giữ nguyên
  if (groups.every(group => group.count === 1)) {

    return {
      word: original,
      data: null
    };

  }

  /*
    Tạo các cách bỏ bớt chữ lặp.

    Ví dụ 工工厂厂 có thể tạo:
    工工厂厂
    工厂厂
    工工厂
    工厂

    Chỉ nhận phương án có nghĩa trong từ điển.
  */

  const candidates = [];

  function generate(index, current, removed) {

    if (index === groups.length) {

      if (removed > 0) {

        const found = findWordData(current);

        if (found) {
          candidates.push({
            word: current,
            data: found,
            removed: removed
          });
        }

      }

      return;
    }

    const group = groups[index];

    // Giới hạn để tránh tạo quá nhiều tổ hợp
    const maxCount = Math.min(group.count, 8);

    for (let n = maxCount; n >= 1; n--) {

      generate(
        index + 1,
        current + group.char.repeat(n),
        removed + group.count - n
      );

    }

  }

  generate(0, "", 0);

  // Ưu tiên phương án cần sửa ít nhất
  candidates.sort((a, b) => {

    if (a.removed !== b.removed) {
      return a.removed - b.removed;
    }

    return b.word.length - a.word.length;

  });

  if (candidates.length > 0) {

    return {
      word: candidates[0].word,
      data: candidates[0].data
    };

  }

  // Không đoán bừa nếu không tìm được từ đúng
  return {
    word: original,
    data: null
  };

}


// Giữ tương thích với những chỗ gọi hàm cũ
function getWordData(word) {
  return resolveWord(word).data;
}


/* =========================================
   4. CÁC THÀNH PHẦN TRANG WEB
========================================= */

const fileInput = document.getElementById("pdfFile");
const viewer = document.getElementById("viewer");
const pageBox = document.getElementById("page");
const canvas = document.getElementById("canvas");
const overlay = document.getElementById("overlay");
const meaning = document.getElementById("meaning");
const statusText = document.getElementById("status");
const placeholder = document.getElementById("placeholder");

let pdfPage = null;

let pageWidth = 0;
let pageHeight = 0;

let zoom = 1;

let renderTask = null;
let renderVersion = 0;


/* =========================================
   5. CHUẨN HÓA CHỮ HÁN
========================================= */

function normalizeWord(text) {

  return String(text || "")
    .normalize("NFKC")
    .replace(/\s+/g, "");

}


/* =========================================
   6. HIỂN THỊ PINYIN VÀ NGHĨA TIẾNG VIỆT
========================================= */

function showMeaning(word, event) {

  const resolved = resolveWord(word);

  const data = resolved.data;

  const correctWord = resolved.word;

  const pinyin = data
    ? data[0]
    : "Chưa có pinyin";

  const vietnamese = data
    ? data[1]
    : "Chưa bổ sung nghĩa tiếng Việt";

  meaning.replaceChildren();

  const hanziElement = document.createElement("strong");
  hanziElement.textContent = correctWord;

  const pinyinElement = document.createElement("span");
  pinyinElement.className = "pinyin";
  pinyinElement.textContent = pinyin;

  const vietnameseElement = document.createElement("span");
  vietnameseElement.className = "vietnamese";
  vietnameseElement.textContent = vietnamese;

  meaning.appendChild(hanziElement);
  meaning.appendChild(document.createElement("br"));

  meaning.appendChild(pinyinElement);
  meaning.appendChild(document.createElement("br"));

  meaning.appendChild(vietnameseElement);

  meaning.style.display = "block";

  const box = meaning.getBoundingClientRect();

  let left = event.clientX - box.width / 2;
  let top = event.clientY - box.height - 18;

  left = Math.max(
    8,
    Math.min(left, window.innerWidth - box.width - 8)
  );

  if (top < 8) {
    top = event.clientY + 18;
  }

  if (top + box.height > window.innerHeight - 8) {
    top = Math.max(8, window.innerHeight - box.height - 8);
  }

  meaning.style.left = left + "px";
  meaning.style.top = top + "px";

}


function hideMeaning() {
  meaning.style.display = "none";
}


/* =========================================
   7. PHÓNG TO PDF SẮC NÉT
========================================= */

async function setZoom(value) {

  zoom = Math.max(0.1, Math.min(value, 3));

  if (!pdfPage) return;

  hideMeaning();

  const version = ++renderVersion;

  if (renderTask) {

    renderTask.cancel();

    try {
      await renderTask.promise;
    } catch (error) {

      if (error.name !== "RenderingCancelledException") {
        console.error(error);
      }

    }

  }

  if (version !== renderVersion) return;

  const viewport = pdfPage.getViewport({
    scale: zoom
  });

  /*
    Giới hạn độ phân giải canvas để tránh
    dùng quá nhiều bộ nhớ khi phóng to.
  */

  const maxPixels = 28000000;

  const desiredRatio = Math.min(
    window.devicePixelRatio || 1,
    2
  );

  const safeRatio = Math.sqrt(
    maxPixels / (viewport.width * viewport.height)
  );

  const pixelRatio = Math.max(
    0.1,
    Math.min(desiredRatio, safeRatio)
  );

  canvas.width = Math.ceil(
    viewport.width * pixelRatio
  );

  canvas.height = Math.ceil(
    viewport.height * pixelRatio
  );

  pageBox.style.width = viewport.width + "px";
  pageBox.style.height = viewport.height + "px";

  const context = canvas.getContext("2d");

  renderTask = pdfPage.render({

    canvasContext: context,

    viewport: viewport,

    transform: [
      pixelRatio, 0, 0,
      pixelRatio, 0, 0
    ]

  });

  try {

    await renderTask.promise;

  } catch (error) {

    if (error.name !== "RenderingCancelledException") {
      console.error("Lỗi hiển thị PDF:", error);
    }

  }

}


/* =========================================
   8. MỞ BẢNG PDF
========================================= */

async function openPDF(bytes) {

  statusText.textContent = "Đang đọc bảng PDF...";

  /*
    Tạo bản sao dữ liệu.
    PDF.js có thể chuyển quyền sở hữu bộ nhớ,
    nên không dùng trực tiếp bản đang lưu.
  */

  const pdfBytes = new Uint8Array(bytes.slice(0));

  const documentPDF = await pdfjsLib.getDocument({
    data: pdfBytes
  }).promise;

  pdfPage = await documentPDF.getPage(1);

  const viewport = pdfPage.getViewport({
    scale: 1
  });

  pageWidth = viewport.width;
  pageHeight = viewport.height;

  pageBox.style.display = "block";
  placeholder.style.display = "none";

  const textContent = await pdfPage.getTextContent();

  overlay.replaceChildren();

  let count = 0;

  for (const item of textContent.items) {

    const word = normalizeWord(item.str);

    if (!word) continue;

    const transform = pdfjsLib.Util.transform(
      viewport.transform,
      item.transform
    );

    const x = transform[4];
    const baseline = transform[5];

    const fontHeight = Math.max(
      10,
      Math.hypot(transform[2], transform[3])
    );

    const hitWidth = Math.max(
      24,
      item.width + 8
    );

    const hitHeight = Math.max(
      20,
      fontHeight + 8
    );

    const cell = document.createElement("div");

    cell.className = "word";

    cell.style.left =
      ((x - 4) / pageWidth * 100) + "%";

    cell.style.top =
      ((baseline - fontHeight - 4) / pageHeight * 100) + "%";

    cell.style.width =
      (hitWidth / pageWidth * 100) + "%";

    cell.style.height =
      (hitHeight / pageHeight * 100) + "%";

    cell.addEventListener("pointerdown", event => {

      if (event.pointerType === "mouse" && event.button !== 0) {
        return;
      }

      showMeaning(word, event);

    });

    cell.addEventListener("pointerup", hideMeaning);
    cell.addEventListener("pointercancel", hideMeaning);
    cell.addEventListener("pointerleave", hideMeaning);

    cell.addEventListener("contextmenu", event => {
      event.preventDefault();
    });

    overlay.appendChild(cell);

    count++;

  }

  const initialZoom = Math.min(
    1,
    (viewer.clientWidth - 20) / pageWidth
  );

  await setZoom(initialZoom);

  const hsk5Count = Object.keys(
    window.HSK5_DATA || {}
  ).length;

  statusText.textContent =
    count + " mục từ | HSK 5: " +
    hsk5Count + " từ đã có nghĩa";

}


/* =========================================
   9. LƯU PDF TRONG TRÌNH DUYỆT
========================================= */

function openDatabase() {

  return new Promise((resolve, reject) => {

    const request = indexedDB.open(
      "HSKPosterDB",
      1
    );

    request.onupgradeneeded = () => {

      const db = request.result;

      if (!db.objectStoreNames.contains("files")) {
        db.createObjectStore("files");
      }

    };

    request.onsuccess = () => {
      resolve(request.result);
    };

    request.onerror = () => {
      reject(request.error);
    };

  });

}


/* =========================================
   10. LƯU FILE PDF
========================================= */

async function savePDF(bytes) {

  const db = await openDatabase();

  try {

    await new Promise((resolve, reject) => {

      const transaction = db.transaction(
        "files",
        "readwrite"
      );

      transaction.objectStore("files").put(
        bytes.slice(0),
        "poster"
      );

      transaction.oncomplete = resolve;

      transaction.onerror = () => {
        reject(transaction.error);
      };

      transaction.onabort = () => {
        reject(transaction.error);
      };

    });

  } finally {

    db.close();

  }

}


/* =========================================
   11. TỰ ĐỘNG MỞ PDF ĐÃ LƯU
========================================= */

async function restorePDF() {

  try {

    const db = await openDatabase();

    const bytes = await new Promise((resolve, reject) => {

      const transaction = db.transaction(
        "files",
        "readonly"
      );

      const request = transaction
        .objectStore("files")
        .get("poster");

      request.onsuccess = () => {
        resolve(request.result);
      };

      request.onerror = () => {
        reject(request.error);
      };

    });

    db.close();

    if (bytes) {

      await openPDF(bytes);

    } else {

      statusText.textContent = "Chưa mở bảng PDF";

    }

  } catch (error) {

    console.error("Không thể khôi phục PDF:", error);

    statusText.textContent =
      "Chọn bảng PDF để bắt đầu";

  }

}


/* =========================================
   12. CHỌN FILE PDF MỚI
========================================= */

fileInput.addEventListener("change", async event => {

  const file = event.target.files[0];

  if (!file) return;

  try {

    const bytes = await file.arrayBuffer();

    /*
      LƯU TRƯỚC, MỞ SAU
      để tránh lỗi DataCloneError.
    */

    await savePDF(bytes);

    await openPDF(bytes);

  } catch (error) {

    console.error(error);

    statusText.textContent = "Không đọc được PDF";

    alert("Lỗi mở PDF: " + error.message);

  }

});


/* =========================================
   13. NÚT PHÓNG TO / THU NHỎ
========================================= */

document.getElementById("zoomIn").onclick = () => {
  setZoom(zoom * 1.4);
};

document.getElementById("zoomOut").onclick = () => {
  setZoom(zoom / 1.4);
};


/* =========================================
   14. THẢ TAY THÌ ẨN NGHĨA
========================================= */

window.addEventListener("pointerup", hideMeaning);

window.addEventListener("pointercancel", hideMeaning);

window.addEventListener("blur", hideMeaning);


/* =========================================
   15. KHỞI ĐỘNG TRANG WEB
========================================= */

restorePDF();

</script>

</body>
